name: kaksha_parent
description: "Kaksha Sathi Parents: home practice app (structured voice tutor)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  audioplayers: ^6.5.1
  flutter_tts: ^4.2.0
  http: ^1.2.2
  record: ^6.2.1
  share_plus: ^13.3.1
  shared_preferences: ^2.3.3
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # UI translation tables (tool/l10n_translate.py) and fonts for scripts phones often lack.
  # Noto Sans Ol Chiki / Meetei Mayek: SIL Open Font License 1.1, see assets/fonts/OFL-*.txt.
  assets:
    - assets/i18n/
  fonts:
    - family: NotoSansOlChiki
      fonts:
        - asset: assets/fonts/NotoSansOlChiki-Regular.ttf
    - family: NotoSansMeeteiMayek
      fonts:
        - asset: assets/fonts/NotoSansMeeteiMayek-Regular.ttf
# Icons are drawn by tools/make_app_icons.py; regenerate with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: ic_launcher
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#025149"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  adaptive_icon_monochrome: assets/icon/icon_mono.png
  web:
    generate: true
    image_path: assets/icon/icon.png
    background_color: "#FBF8F2"
    theme_color: "#0F6B5C"
