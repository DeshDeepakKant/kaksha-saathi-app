name: kaksha_parent
description: "Kaksha Saathi — home practice app (structured voice tutor)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  audioplayers: ^6.5.1
  flutter_tts: ^4.2.0
  http: ^1.2.2
  record: ^6.2.1
  share_plus: ^13.3.1
  shared_preferences: ^2.3.3
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # UI translation tables (tool/l10n_translate.py) and fonts for scripts phones often lack.
  # Noto Sans Ol Chiki / Meetei Mayek: SIL Open Font License 1.1, see assets/fonts/OFL-*.txt.
  assets:
    - assets/i18n/
  fonts:
    - family: NotoSansOlChiki
      fonts:
        - asset: assets/fonts/NotoSansOlChiki-Regular.ttf
    - family: NotoSansMeeteiMayek
      fonts:
        - asset: assets/fonts/NotoSansMeeteiMayek-Regular.ttf
