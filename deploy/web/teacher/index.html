<!DOCTYPE html>
<html lang="hi">
<head>
  <base href="/teacher/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Kaksha Saathi — teacher app for continuous learning-gap diagnosis and classroom intervention.">
  <meta name="theme-color" content="#0f6b5c">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>कक्षा साथी · शिक्षिका</title>
  <style>
    html, body { margin: 0; height: 100%; background: #fbf8f2; }
    #splash { position: fixed; inset: 0; display: grid; place-items: center; font-family: system-ui, "Noto Sans Devanagari", sans-serif; color: #0f6b5c; text-align: center; }
    #splash .t { font-size: 26px; font-weight: 700; }
    #splash .s { font-size: 15px; color: #5c6b69; margin-top: 6px; }
    #splash .d { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #0f6b5c; border-top-color: transparent; animation: spin 1s linear infinite; margin: 0 auto 14px; }
    @keyframes spin { to { transform: rotate(360deg) } }
  </style>
</head>
<body>
  <div id="splash"><div><div class="d"></div><div class="t">कक्षा साथी</div><div class="s">हर बच्चा कहाँ है — और आज क्या करें</div></div></div>
  <script>
    // Speech bridge used by lib/tts.dart (flutter_tts has no web support).
    window.KakshaSpeak = function (text) {
      try {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'hi-IN';
        u.rate = 0.85;
        const voices = window.speechSynthesis.getVoices();
        const hi = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('hi'));
        if (hi) u.voice = hi;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(u);
      } catch (e) { console.warn('speech unavailable', e); }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
